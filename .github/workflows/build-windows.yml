name: Build Windows Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: .\build\build_installer.ps1

      - name: Verify installer exists
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/WxMpCatcher-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer exe not found under dist/" }
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length/1MB, 2)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: WxMpCatcher-Setup
          path: dist/WxMpCatcher-Setup-*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Upload portable bundle
        uses: actions/upload-artifact@v5
        with:
          name: WxMpCatcher-Portable
          path: dist/wx-mp-catcher/
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/WxMpCatcher-Setup-*.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows 安装包构建成功"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- 安装包: ``$($setup.Name)``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- 大小: $([math]::Round($setup.Length/1MB, 2)) MB"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "在 **Actions → 本次运行 → Artifacts** 中下载 ``WxMpCatcher-Setup``。"
