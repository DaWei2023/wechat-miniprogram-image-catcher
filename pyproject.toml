[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wx-mp-catcher"
version = "0.1.0"
description = "Windows 电脑版微信小程序图片自动抓取与分类保存工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wx-mp-catcher" }]
dependencies = [
  "watchdog>=4.0.0",
  "psutil>=5.9.0",
  "pycryptodome>=3.20.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyinstaller>=6.0.0"]

[project.scripts]
wx-mp-catcher = "wx_mp_catcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
